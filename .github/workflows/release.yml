name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info

      - name: Prepare release artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            abi="${apk##*/app-}"
            abi="${abi%-release.apk}"
            out="release/dotmatrix-timer-${VERSION}-${abi}.apk"
            cp "$apk" "$out"
            sha256sum "$out" > "${out}.sha256"
          done

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-info
          path: build/debug-info
          if-no-files-found: ignore

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/dotmatrix-timer-*.apk
            release/dotmatrix-timer-*.apk.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}