name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare release artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp build/app/outputs/flutter-apk/app-release.apk "dotmatrix-timer-${VERSION}.apk"
          sha256sum "dotmatrix-timer-${VERSION}.apk" > "dotmatrix-timer-${VERSION}.apk.sha256"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dotmatrix-timer-*.apk
            dotmatrix-timer-*.apk.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}